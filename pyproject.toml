[project]
name = "respiradar"
version = "0.1.0"
description = "Ambient nighttime breathing-rate monitoring with the Acconeer A121 (SparkFun XM125)"
requires-python = ">=3.10,<3.14"
dependencies = [
    "acconeer-exptool[algo]==7.18.2",
    "numpy",
    "scipy",
    "fastapi",
    "uvicorn[standard]",
    "pyqtgraph",
    "PySide6",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["respiradar"]

[tool.setuptools.package-data]
respiradar = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]  # so tests can import the top-level scripts (main.py, datalog.py)
