[project]
name = "respiradar"
version = "0.1.0"
description = "Ambient nighttime breathing-rate monitoring with the Acconeer A121 (SparkFun XM125)"
requires-python = ">=3.10,<3.14"
dependencies = [
    "acconeer-exptool[algo]==7.18.2",
    "numpy",
    "scipy",
    "fastapi",
    "uvicorn[standard]",
    "pyqtgraph",
    "PySide6",
    "scikit-learn",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["respiradar"]

[tool.setuptools.package-data]
respiradar = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]  # so tests can import the top-level scripts (main.py, datalog.py)
# Run in parallel by default: a handful of tests replay whole 3-minute recordings and
# dominate the wall clock, so a bare `pytest` should spread them over the cores. Use
# `-p no:xdist` (or `-n0`) to get a serial run back when debugging.
# QT_QPA_PLATFORM=offscreen is set in tests/conftest.py, not here, so it applies to every
# worker and to anyone importing the test modules directly.
addopts = "-n auto --dist worksteal"
