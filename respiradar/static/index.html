<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RespiRadar</title>
<style>
  body { font-family: system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 16px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .card { background: #1c1c1c; border-radius: 8px; padding: 12px 16px; }
  .big { font-size: 56px; font-weight: 600; }
  .label { color: #999; font-size: 13px; }
  .alert { color: #ff6b6b; }
  canvas { width: 100%; height: 220px; display: block; }
</style>
</head>
<body>
<h2>RespiRadar</h2>
<div class="row">
  <div class="card"><div class="label">Breathing rate (bpm)</div><div class="big" id="rate">--</div></div>
  <div class="card"><div class="label">Target distance</div><div class="big" id="target">--</div></div>
  <div class="card"><div class="label">Status</div><div id="status">connecting</div><div id="events" class="alert"></div></div>
</div>
<div class="card" style="margin-top:16px"><div class="label">Chest displacement (mm), last 30 s</div><canvas id="disp"></canvas></div>
<div class="card" style="margin-top:16px"><div class="label">Range profile (amplitude vs distance, m)</div><canvas id="profile"></canvas></div>

<script>
function plot(canvas, xs, ys, marker) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  if (!ys || ys.length < 2) return;
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (y1 - y0 < 1e-9) { y0 -= 1; y1 += 1; }
  const px = x => (x - x0) / (x1 - x0 || 1) * (w - 50) + 45;
  const py = y => h - 15 - (y - y0) / (y1 - y0) * (h - 30);
  ctx.fillStyle = "#888"; ctx.font = "11px system-ui";
  ctx.fillText(y1.toFixed(2), 0, 15); ctx.fillText(y0.toFixed(2), 0, h - 12);
  ctx.strokeStyle = "#4fc3f7"; ctx.lineWidth = 2; ctx.beginPath();
  ys.forEach((y, i) => i ? ctx.lineTo(px(xs[i]), py(y)) : ctx.moveTo(px(xs[i]), py(y)));
  ctx.stroke();
  if (marker !== undefined) {
    ctx.strokeStyle = "#ffb74d"; ctx.beginPath();
    ctx.moveTo(px(marker), 0); ctx.lineTo(px(marker), h); ctx.stroke();
  }
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = e => {
    const d = JSON.parse(e.data);
    document.getElementById("status").textContent = `${d.status}${d.source ? " (" + d.source + ")" : ""}`;
    if (d.status !== "running") return;
    document.getElementById("rate").textContent = d.rate_bpm == null ? "--" : d.rate_bpm.toFixed(1);
    document.getElementById("target").textContent = d.target_m.toFixed(2) + " m";
    document.getElementById("events").textContent = d.events.join(", ");
    plot(document.getElementById("disp"), d.times, d.displacement_mm);
    plot(document.getElementById("profile"), d.distances_m, d.range_profile, d.target_m);
  };
  ws.onclose = () => {
    document.getElementById("status").textContent = "disconnected, retrying";
    setTimeout(connect, 1000);
  };
}
connect();
</script>
</body>
</html>
